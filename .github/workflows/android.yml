
name: Build AnyGSI APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: anygsi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          
      - name: Build AnyGSI APK
        shell: bash
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

          test -s AnyGSI.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 AnyGSI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose AnyGSI.apk

      - name: Prepare release assets
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          mkdir -p release
          cp AnyGSI.apk "release/AnyGSI-${TAG}.apk"

          (
            cd release
            sha256sum "AnyGSI-${TAG}.apk" \
              > "AnyGSI-${TAG}.apk.sha256"
          )

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=release/AnyGSI-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "checksum=release/AnyGSI-${TAG}.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyGSI-${{ steps.release.outputs.tag }}
          path: |
            ${{ steps.release.outputs.apk }}
            ${{ steps.release.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AnyGSI ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release.outputs.apk }}
            ${{ steps.release.outputs.checksum }}
